<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Product Form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="page-container">
    <a th:href="@{/admin/products}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Products</a>
    <h1 class="page-title">
        <span th:if="${product.id == null}"><i class="fas fa-plus"></i> Add New Product</span>
        <span th:unless="${product.id == null}"><i class="fas fa-edit"></i> Edit Product</span>
    </h1>

    <div class="form-card">
        <form th:action="@{/admin/products/save}" th:object="${product}" method="post" class="auth-form">
            <input type="hidden" th:field="*{id}"/>
            <div class="form-row">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" th:field="*{name}" placeholder="e.g., iPhone 15 Pro" required/>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <input type="text" th:field="*{category}" list="categories"
                           placeholder="e.g., Electronics" required/>
                    <datalist id="categories">
                        <option th:each="cat : ${categories}" th:value="${cat}"></option>
                    </datalist>
                </div>
            </div>
            <div class="form-group full">
                <label>Description</label>
                <textarea th:field="*{description}" rows="3"
                          placeholder="Enter product description..."></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Price (₹) *</label>
                    <input type="number" th:field="*{price}" placeholder="0.00"
                           step="0.01" min="0" required/>
                </div>
                <div class="form-group">
                    <label>Stock Quantity *</label>
                    <input type="number" th:field="*{stock}" placeholder="0" min="0" required/>
                </div>
            </div>
            <div class="form-group full">
                <label>Image URL</label>
                <input type="url" th:field="*{imageUrl}"
                       placeholder="https://example.com/image.jpg"/>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" th:field="*{active}"/> Active (visible to customers)
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Save Product
                </button>
                <a th:href="@{/admin/products}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<footer class="footer"><p>&copy; 2026 ShopEase Admin Panel</p></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
