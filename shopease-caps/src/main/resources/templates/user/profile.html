<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="page-container">
    <h1 class="page-title"><i class="fas fa-user-circle"></i> My Profile</h1>

    <div th:if="${success}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>

    <div class="profile-layout">
        <div class="profile-card">
            <div class="profile-avatar">
                <i class="fas fa-user-circle"></i>
                <h3 th:text="${user.name}">Name</h3>
                <span th:text="${user.email}">Email</span>
                <span class="role-badge" th:text="${user.role.replace('ROLE_','')}">Role</span>
            </div>
            <div class="profile-stats">
                <div><strong th:text="${user.orders.size()}">0</strong><span>Orders</span></div>
                <div><strong th:text="${#temporals.format(user.createdAt, 'MMM yyyy')}">-</strong><span>Member Since</span></div>
            </div>
        </div>

        <div class="profile-form-card">
            <h3>Edit Profile</h3>
            <form th:action="@{/profile/update}" th:object="${user}" method="post" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" th:field="*{name}" required/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email (Read Only)</label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" th:value="${user.email}" readonly/>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <div class="input-icon">
                            <i class="fas fa-phone"></i>
                            <input type="tel" th:field="*{phone}"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <div class="input-icon">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" th:field="*{address}"/>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Update Profile
                </button>
            </form>
        </div>
    </div>
</div>
<footer class="footer"><p>&copy; 2026 ShopEase. All rights reserved.</p></footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
