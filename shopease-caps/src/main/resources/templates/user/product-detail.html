<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page-container">
    <div class="breadcrumb">
        <a th:href="@{/products}">Shop</a> &rsaquo;
        <a th:href="@{/products(category=${product.category})}" th:text="${product.category}">Category</a> &rsaquo;
        <span th:text="${product.name}">Product</span>
    </div>

    <div class="product-detail">
        <div class="detail-image">
            <img th:src="${product.imageUrl}" th:alt="${product.name}"
                 onerror="this.src='https://via.placeholder.com/500x400?text=No+Image'"/>
        </div>
        <div class="detail-info">
            <span class="detail-category" th:text="${product.category}">Category</span>
            <h1 th:text="${product.name}">Product Name</h1>
            <div class="detail-price">
                ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">0.00</span>
            </div>
            <p class="detail-desc" th:text="${product.description}">Description</p>

            <div class="detail-stock">
                <span th:if="${product.stock > 0}" class="in-stock">
                    <i class="fas fa-check-circle"></i> In Stock (<span th:text="${product.stock}"></span> available)
                </span>
                <span th:unless="${product.stock > 0}" class="out-stock">
                    <i class="fas fa-times-circle"></i> Out of Stock
                </span>
            </div>

            <sec:authorize access="isAuthenticated()">
                <form th:action="@{/cart/add}" method="post" class="detail-cart-form">
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <div class="qty-selector">
                        <label>Quantity:</label>
                        <input type="number" name="quantity" value="1" min="1"
                               th:max="${product.stock}"/>
                    </div>
                    <div class="detail-actions">
                        <button type="submit" class="btn-primary" th:disabled="${product.stock == 0}">
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </button>
                        <a th:href="@{/cart}" class="btn-secondary">
                            <i class="fas fa-shopping-cart"></i> View Cart
                        </a>
                    </div>
                </form>
            </sec:authorize>
            <sec:authorize access="!isAuthenticated()">
                <a th:href="@{/login}" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login to Add to Cart
                </a>
            </sec:authorize>
        </div>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
