<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-shopping-bag auth-logo"></i>
            <h2>Welcome Back</h2>
            <p>Login to your ShopEase account</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>
        <div th:if="${logout}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${logout}"></span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="username" placeholder="your@email.com" required/>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="••••••••" required/>
                </div>
            </div>
            <button type="submit" class="btn-full">Login <i class="fas fa-arrow-right"></i></button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
        </div>

        <div class="demo-creds">
            <p><strong>Demo Accounts:</strong></p>
            <p>User: user@shopease.com / user123</p>
            <p>Admin: admin@shopease.com / admin123</p>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
