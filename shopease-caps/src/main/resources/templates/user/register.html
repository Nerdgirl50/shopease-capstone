<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-page">
    <div class="auth-card wide">
        <div class="auth-header">
            <i class="fas fa-user-plus auth-logo"></i>
            <h2>Create Account</h2>
            <p>Join ShopEase and start shopping!</p>
        </div>

        <div th:if="${error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" th:field="*{name}" placeholder="John Doe" required minlength="2"/>
                    </div>
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" th:field="*{email}" placeholder="your@email.com" required/>
                    </div>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" th:field="*{password}" placeholder="Min 6 characters" required minlength="6"/>
                    </div>
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></span>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-icon">
                        <i class="fas fa-phone"></i>
                        <input type="tel" th:field="*{phone}" placeholder="10-digit number"/>
                    </div>
                </div>
            </div>
            <div class="form-group full">
                <label>Address</label>
                <div class="input-icon">
                    <i class="fas fa-map-marker-alt"></i>
                    <input type="text" th:field="*{address}" placeholder="Your full address"/>
                </div>
            </div>
            <button type="submit" class="btn-full">Create Account <i class="fas fa-arrow-right"></i></button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
