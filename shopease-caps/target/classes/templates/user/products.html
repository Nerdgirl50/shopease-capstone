<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Shop')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page-container">
    <!-- Hero Banner -->
    <div class="hero-banner">
        <h1><i class="fas fa-store"></i> ShopEase Store</h1>
        <p>Discover amazing products at unbeatable prices</p>
        <form th:action="@{/products}" method="get" class="hero-search">
            <input type="text" name="keyword" th:value="${keyword}"
                   placeholder="Search products, brands, categories..."/>
            <button type="submit"><i class="fas fa-search"></i> Search</button>
        </form>
    </div>

    <div class="shop-layout">
        <!-- Sidebar Filters -->
        <aside class="sidebar">
            <h3><i class="fas fa-filter"></i> Categories</h3>
            <ul class="category-list">
                <li>
                    <a th:href="@{/products}"
                       th:class="${selectedCategory == null and keyword == null} ? 'active' : ''">
                        <i class="fas fa-th"></i> All Products
                    </a>
                </li>
                <li th:each="cat : ${categories}">
                    <a th:href="@{/products(category=${cat})}"
                       th:class="${selectedCategory == cat} ? 'active' : ''"
                       th:text="${cat}">Category</a>
                </li>
            </ul>
        </aside>

        <!-- Products Grid -->
        <main class="products-main">
            <div class="products-header">
                <span th:text="${products.size()} + ' products found'">Products</span>
                <span th:if="${keyword}" th:text="'Results for: &quot;' + ${keyword} + '&quot;'"
                      class="search-label"></span>
            </div>

            <div th:if="${#lists.isEmpty(products)}" class="empty-state">
                <i class="fas fa-box-open"></i>
                <p>No products found. <a th:href="@{/products}">View all products</a></p>
            </div>

            <div class="products-grid">
                <div class="product-card" th:each="product : ${products}">
                    <a th:href="@{/products/{id}(id=${product.id})}">
                        <div class="product-img">
                            <img th:src="${product.imageUrl}"
                                 th:alt="${product.name}"
                                 onerror="this.src='https://via.placeholder.com/300x250?text=No+Image'"/>
                            <span class="product-category" th:text="${product.category}">Category</span>
                        </div>
                        <div class="product-info">
                            <h3 th:text="${product.name}">Product Name</h3>
                            <p class="product-desc" th:text="${product.description}">Description</p>
                            <div class="product-footer">
                                <span class="product-price">
                                    ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                                </span>
                                <span class="product-stock"
                                      th:class="${product.stock > 0} ? 'in-stock' : 'out-stock'"
                                      th:text="${product.stock > 0} ? 'In Stock' : 'Out of Stock'">Stock</span>
                            </div>
                        </div>
                    </a>
                    <sec:authorize access="isAuthenticated()">
                        <form th:action="@{/cart/add}" method="post" class="add-to-cart-form">
                            <input type="hidden" name="productId" th:value="${product.id}"/>
                            <input type="hidden" name="quantity" value="1"/>
                            <button type="submit" class="btn-add-cart"
                                    th:disabled="${product.stock == 0}">
                                <i class="fas fa-cart-plus"></i> Add to Cart
                            </button>
                        </form>
                    </sec:authorize>
                    <sec:authorize access="!isAuthenticated()">
                        <a th:href="@{/login}" class="btn-add-cart">
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </a>
                    </sec:authorize>
                </div>
            </div>
        </main>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 ShopEase. All rights reserved. | Built with Spring Boot</p>
</footer>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
